server:
  port: 8082

spring:
  application:
    name: metadata-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:aetheris}
    username: ${DB_USER:aetheris}
    password: ${DB_PASSWORD:aetheris}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: metadata
    default-schema: metadata
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}

info:
  app:
    version: 0.1.0

aetheris:
  datasource:
    master-key: ${AETHERIS_DATASOURCE_MASTER_KEY:}
    health:
      ttl-seconds: ${DATASOURCE_HEALTH_TTL_SECONDS:60}
      timeout-ms: ${DATASOURCE_HEALTH_TIMEOUT_MS:10000}
      max-concurrent: ${DATASOURCE_HEALTH_MAX_CONCURRENT:4}
  managed-datasource:
    enabled: ${REGISTER_INTERNAL_DATASOURCE:true}
  internal-token: ${AETHERIS_INTERNAL_TOKEN:}
  auth:
    base-url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8087}
  identity:
    max-skew-ms: ${AETHERIS_IDENTITY_MAX_SKEW_MS:300000}
  workflow:
    base-url: http://${WORKFLOW_SERVICE_HOST:localhost}:${WORKFLOW_SERVICE_PORT:8088}
  lakehouse:
    maintenance-reconcile-interval-ms: ${AETHERIS_LAKEHOUSE_MAINTENANCE_RECONCILE_INTERVAL_MS:5000}
