server:
  port: 8089

spring:
  application:
    name: serving-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:aetheris}
    username: ${DB_USER:aetheris}
    password: ${DB_PASSWORD:aetheris}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: serving
    default-schema: serving
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

aetheris:
  internal-token: ${AETHERIS_INTERNAL_TOKEN:}
  auth:
    base-url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8087}
  rate-limit:
    capacity: ${AETHERIS_SERVING_RATE_LIMIT_CAPACITY:60}
    window-ms: ${AETHERIS_SERVING_RATE_LIMIT_WINDOW_MS:60000}
  metadata:
    base-url: http://${METADATA_SERVICE_HOST:localhost}:${METADATA_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}
