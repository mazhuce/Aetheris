server:
  port: 8081

spring:
  application:
    name: system-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:aetheris}
    username: ${DB_USER:aetheris}
    password: ${DB_PASSWORD:aetheris}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: system
    default-schema: system
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

aetheris:
  # 与网关共享的内部令牌：校验 X-Aetheris-Identity 身份签名，并调用
  # auth-service /internal/permissions 判定。未配置时敏感端点 fail-closed。
  internal-token: ${AETHERIS_INTERNAL_TOKEN:}
  auth:
    base-url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8087}
  identity:
    max-skew-ms: ${AETHERIS_IDENTITY_MAX_SKEW_MS:300000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${AETHERIS_OPENAPI_ENABLED:false}

info:
  app:
    version: 0.1.0
