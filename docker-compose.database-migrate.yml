# Operations-only jobs; never attach privileged secrets to runtime services.
{
  "services": {
    "db-migrate-auth": {
      "profiles": [
        "db-migrate"
      ],
      "image": "${AETHERIS_DB_MIGRATION_IMAGE:?Use the reviewed runner image at sha256 digest}",
      "pull_policy": "never",
      "restart": "no",
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "pids_limit": 128,
      "mem_limit": "384m",
      "cpus": 1.0,
      "command": [
        "--config",
        "/run/config/migration.json"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${AETHERIS_AUTH_DB_MIGRATION_CONFIG:-./configs/database/migration-auth.example.json}",
          "target": "/run/config/migration.json",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "./services/auth/src/main/resources/db/migration",
          "target": "/migrations",
          "read_only": true
        }
      ],
      "secrets": [
        {
          "source": "db_admin_password",
          "target": "db-admin-password",
          "uid": "10001",
          "gid": "10001",
          "mode": 256
        },
        {
          "source": "db_auth_migration",
          "target": "db-migration-password",
          "uid": "10001",
          "gid": "10001",
          "mode": 256
        }
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
