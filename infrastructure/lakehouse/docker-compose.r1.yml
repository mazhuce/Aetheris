name: aetheris-r1-lakehouse

services:
  object-store:
    image: minio/minio:RELEASE.2024-06-13T19-53-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R1_MINIO_ACCESS_KEY:?R1_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${R1_MINIO_SECRET_KEY:?R1_MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${R1_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${R1_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - r1-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store-init:
    image: minio/mc:RELEASE.2024-06-13T19-53-16Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-store:9000 "$${R1_MINIO_ACCESS_KEY}" "$${R1_MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing local/warehouse
    environment:
      R1_MINIO_ACCESS_KEY: ${R1_MINIO_ACCESS_KEY:?R1_MINIO_ACCESS_KEY is required}
      R1_MINIO_SECRET_KEY: ${R1_MINIO_SECRET_KEY:?R1_MINIO_SECRET_KEY is required}
    depends_on:
      object-store:
        condition: service_healthy
    restart: "no"

  catalog:
    image: tabulario/iceberg-rest:1.7.1
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      AWS_ACCESS_KEY_ID: ${R1_MINIO_ACCESS_KEY:?R1_MINIO_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${R1_MINIO_SECRET_KEY:?R1_MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${R1_CATALOG_PORT:-18181}:8181"
    depends_on:
      object-store-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:476
    ports:
      - "127.0.0.1:${R1_TRINO_PORT:-18080}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      catalog:
        condition: service_started

  flink-jobmanager:
    image: flink:1.20.1-java21
    command: jobmanager
    ports:
      - "127.0.0.1:${R1_FLINK_UI_PORT:-18081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: hashmap
        rest.flamegraph.enabled: false

  flink-taskmanager:
    image: flink:1.20.1-java21
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      flink-jobmanager:
        condition: service_started

volumes:
  r1-minio-data:
