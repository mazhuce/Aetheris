# 本地前端开发覆盖层。保留后端编排，将 web 从 Nginx 生产镜像切换为 Vite HMR。
services:
  web:
    image: aetheris-web-dev:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      API_PROXY_TARGET: http://gateway:8080
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - ./apps/web/tsconfig.json:/app/tsconfig.json
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
