# R1 approved BOM. Every runtime is pinned; R2 CDC/runtime extensions require a separate gate.
[meta]
name = "aetheris-r1-lakehouse"
status = "approved"
format_version = "2"

[runtime]
jdk = "17.0.15"
flink = "1.20.1"
flink_cdc = "3.4.0"
iceberg = "1.7.1"
spark = "3.5.6"
trino = "476"

[builtin_plugins]
flink_s3_filesystem = "flink-s3-fs-hadoop-1.20.1.jar"

[catalog]
implementation = "iceberg-rest"
version = "1.6.0"
endpoint = "http://catalog:8181"

[object_storage]
implementation = "minio"
image = "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
init_image = "quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z"
bucket = "warehouse"

[source_databases]
mysql = "8.0.40"
postgresql = "16.9"

[jdbc_drivers]
postgresql = "42.7.13"
mysql = "9.1.0"
mssql = "12.8.1.jre11"
clickhouse = "0.6.3"
oracle = "23.6.0.24.10"
sqlite = "3.46.1.0"
hive = "3.1.3"
trino = "476"

[acceptance]
required_table_format = "iceberg-v2"
required_engines = ["flink", "spark", "trino"]
rebuild_required = true
