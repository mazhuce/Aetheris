name: aetheris

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aetheris}
      POSTGRES_USER: ${POSTGRES_USER:-aetheris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheris}
    ports:
      # 宿主端口可用 POSTGRES_PORT 覆盖，原因同 web：5433 可能落入
      # Windows 的 Hyper-V 保留端口区间而无法绑定。容器间通信始终用 5432，不受影响。
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheris} -d ${POSTGRES_DB:-aetheris}"]
      interval: 5s
      timeout: 5s
      retries: 12

  system-service:
    build:
      context: .
      dockerfile: services/system/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy

  metadata-service:
    build:
      context: .
      dockerfile: services/metadata/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy

  serving-service:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_started

  quality-service:
    build:
      context: .
      dockerfile: services/quality/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy

  governance-service:
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
      # 任务执行通过 metadata 的 /internal 端点，凭据与驱动都在那边，workflow 不直连数据源。
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_started

  ai-agent:
    build:
      context: .
      dockerfile: services/ai-agent/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # agent 的元数据检索与只读查询下沉到 metadata 服务；
      # 缺少这两个变量会让 base-url 回落到 localhost 而指向 ai-agent 自身，
      # 表现为工具调用全部返回空、模型误以为仓库里没有任何表。
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NICKNAME: ${INITIAL_ADMIN_NICKNAME:-系统管理员}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      QUALITY_SERVICE_HOST: quality-service
      QUALITY_SERVICE_PORT: "8083"
      INGESTION_SERVICE_HOST: ingestion-service
      INGESTION_SERVICE_PORT: "8084"
      GOVERNANCE_SERVICE_HOST: governance-service
      GOVERNANCE_SERVICE_PORT: "8085"
      AI_AGENT_HOST: ai-agent
      AI_AGENT_PORT: "8086"
      WORKFLOW_SERVICE_HOST: workflow-service
      WORKFLOW_SERVICE_PORT: "8088"
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      SERVING_SERVICE_HOST: serving-service
      SERVING_SERVICE_PORT: "8089"
    depends_on:
      - system-service
      - metadata-service
      - quality-service
      - ingestion-service
      - governance-service
      - ai-agent
      - workflow-service
      - auth-service
      - serving-service
    ports:
      - "8080:8080"

  web:
    image: aetheris-web-prod:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      # 宿主端口可用 WEB_PORT 覆盖：Windows 上 Hyper-V 会随机保留端口区间，
      # 5173 若落入保留区间则无法绑定（报 ports are not available）。
      # 排查方法见 docs/datasource-connectivity.md。
      - "${WEB_PORT:-5173}:80"

volumes:
  pgdata:
