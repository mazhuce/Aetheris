name: aetheris

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aetheris}
      POSTGRES_USER: ${POSTGRES_USER:-aetheris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheris}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheris} -d ${POSTGRES_DB:-aetheris}"]
      interval: 5s
      timeout: 5s
      retries: 12

  system-service:
    build:
      context: .
      dockerfile: services/system/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  metadata-service:
    build:
      context: .
      dockerfile: services/metadata/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  quality-service:
    build:
      context: .
      dockerfile: services/quality/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:-aetheris}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      QUALITY_SERVICE_HOST: quality-service
      QUALITY_SERVICE_PORT: "8083"
    depends_on:
      - system-service
      - metadata-service
      - quality-service
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  pgdata:
