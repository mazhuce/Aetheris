name: aetheris

x-java-runtime: &java-runtime
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-database-pool: &database-pool
  # 为扩容和运维连接预留 PostgreSQL 容量；环境变量仍可按部署规模覆盖。
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${AETHERIS_DB_POOL_MIN_IDLE:-1}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${AETHERIS_DB_POOL_MAX_SIZE:-8}

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: docker.1panel.live/library/redis:7.4-alpine
    user: "999:1000"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m
    cpus: 1.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aetheris}
      POSTGRES_USER: ${POSTGRES_USER:-aetheris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # 宿主端口可用 POSTGRES_PORT 覆盖，原因同 web：5433 可能落入
      # Windows 的 Hyper-V 保留端口区间而无法绑定。容器间通信始终用 5432，不受影响。
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheris} -d ${POSTGRES_DB:-aetheris}"]
      interval: 5s
      timeout: 5s
      retries: 12

  system-service:
    <<: *java-runtime
    image: aetheris-local/system:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/system/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
    depends_on:
      postgres:
        condition: service_healthy

  metadata-service:
    <<: *java-runtime
    # xerial SQLite extracts its native library into the temp directory; keep
    # the hardened default for other services but allow executable mappings
    # only in this JDBC adapter's isolated tmpfs.
    tmpfs:
      - /tmp:size=64m,mode=1777,exec
    image: aetheris-local/metadata:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/metadata/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      AETHERIS_DATASOURCE_MASTER_KEY: ${AETHERIS_DATASOURCE_MASTER_KEY:?AETHERIS_DATASOURCE_MASTER_KEY must be set}
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
    depends_on:
      postgres:
        condition: service_healthy

  serving-service:
    <<: *java-runtime
    image: aetheris-local/serving:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AETHERIS_SERVING_RATE_LIMIT_CAPACITY: ${AETHERIS_SERVING_RATE_LIMIT_CAPACITY:-60}
      AETHERIS_SERVING_RATE_LIMIT_WINDOW_MS: ${AETHERIS_SERVING_RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy

  quality-service:
    <<: *java-runtime
    image: aetheris-local/quality:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/quality/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      # 检查失败时写通知（我的待办）。
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy

  ingestion-service:
    <<: *java-runtime
    image: aetheris-local/ingestion:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      # 检查失败时写通知（我的待办）。
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy

  governance-service:
    <<: *java-runtime
    image: aetheris-local/governance:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
    depends_on:
      postgres:
        condition: service_healthy

  workflow-service:
    <<: *java-runtime
    image: aetheris-local/workflow:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.1panel.live/library/maven:3.9.9-eclipse-temurin-21}
        JAVA_IMAGE: ${JAVA_IMAGE:-docker.1panel.live/library/eclipse-temurin:21-jre}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${AETHERIS_GIT_GPG_HOME:-./configs/git-gnupg}
        target: /run/secrets/aetheris-git-gnupg
        read_only: true
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # 任务执行通过 metadata 的 /internal 端点，凭据与驱动都在那边，workflow 不直连数据源。
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      # 任务失败时写通知（我的待办）。
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
      QUALITY_SERVICE_HOST: quality-service
      QUALITY_SERVICE_PORT: "8083"
      # 本机开发的唯一受管 Spark 提交后端；默认关闭，令牌必须与 WSL runner 独立配置一致。
      AETHERIS_SPARK_RUNNER_ENABLED: ${AETHERIS_SPARK_RUNNER_ENABLED:-false}
      AETHERIS_SPARK_RUNNER_BASE_URL: ${AETHERIS_SPARK_RUNNER_BASE_URL:-http://host.docker.internal:18081}
      AETHERIS_SPARK_RUNNER_TOKEN: ${AETHERIS_SPARK_RUNNER_TOKEN:-}
      AETHERIS_SPARK_RUNNER_POLL_INTERVAL_MS: ${AETHERIS_SPARK_RUNNER_POLL_INTERVAL_MS:-5000}
      AETHERIS_SPARK_RUNNER_QUEUE_DISPATCH_INTERVAL_MS: ${AETHERIS_SPARK_RUNNER_QUEUE_DISPATCH_INTERVAL_MS:-2000}
      # Flink SQL Gateway 的连接/轮询参数；任务定义仍可覆盖 endpoint，便于多集群部署。
      AETHERIS_FLINK_SQL_GATEWAY_CONNECT_TIMEOUT: ${AETHERIS_FLINK_SQL_GATEWAY_CONNECT_TIMEOUT:-PT5S}
      AETHERIS_FLINK_SQL_GATEWAY_POLL_INTERVAL_MS: ${AETHERIS_FLINK_SQL_GATEWAY_POLL_INTERVAL_MS:-1000}
      AETHERIS_GIT_ALLOWED_HOSTS: ${AETHERIS_GIT_ALLOWED_HOSTS:-github.com,gitee.com}
      AETHERIS_GIT_CONNECT_TIMEOUT_SECONDS: ${AETHERIS_GIT_CONNECT_TIMEOUT_SECONDS:-8}
      AETHERIS_GIT_FETCH_DEPTH: ${AETHERIS_GIT_FETCH_DEPTH:-64}
      AETHERIS_GIT_MAX_BLOB_BYTES: ${AETHERIS_GIT_MAX_BLOB_BYTES:-1048576}
      JAVA_TOOL_OPTIONS: -Djgit.gpg.home=/run/secrets/aetheris-git-gnupg
      AETHERIS_PIPELINE_DISPATCH_LEASE_SECONDS: ${AETHERIS_PIPELINE_DISPATCH_LEASE_SECONDS:-120}
      AETHERIS_PIPELINE_LEASE_GRACE_SECONDS: ${AETHERIS_PIPELINE_LEASE_GRACE_SECONDS:-120}
      AETHERIS_PIPELINE_RECONCILE_INTERVAL_MS: ${AETHERIS_PIPELINE_RECONCILE_INTERVAL_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      quality-service:
        condition: service_healthy

  ai-agent:
    <<: *java-runtime
    image: aetheris-local/ai-agent:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/ai-agent/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # agent 的元数据检索与只读查询下沉到 metadata 服务；
      # 缺少这两个变量会让 base-url 回落到 localhost 而指向 ai-agent 自身，
      # 表现为工具调用全部返回空、模型误以为仓库里没有任何表。
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy

  auth-service:
    <<: *java-runtime
    image: aetheris-local/auth:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-pool
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-aetheris}
      DB_USER: ${DB_USER:-aetheris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NICKNAME: ${INITIAL_ADMIN_NICKNAME:-系统管理员}
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *java-runtime
    image: aetheris-local/gateway:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AETHERIS_RATE_LIMIT_CAPACITY: ${AETHERIS_RATE_LIMIT_CAPACITY:-60}
      AETHERIS_RATE_LIMIT_WINDOW_SECONDS: ${AETHERIS_RATE_LIMIT_WINDOW_SECONDS:-60}
      AETHERIS_INTERNAL_TOKEN: ${AETHERIS_INTERNAL_TOKEN:?AETHERIS_INTERNAL_TOKEN must be set}
      AETHERIS_IDENTITY_MAX_SKEW_MS: ${AETHERIS_IDENTITY_MAX_SKEW_MS:-300000}
      SYSTEM_SERVICE_HOST: system-service
      SYSTEM_SERVICE_PORT: "8081"
      METADATA_SERVICE_HOST: metadata-service
      METADATA_SERVICE_PORT: "8082"
      QUALITY_SERVICE_HOST: quality-service
      QUALITY_SERVICE_PORT: "8083"
      INGESTION_SERVICE_HOST: ingestion-service
      INGESTION_SERVICE_PORT: "8084"
      GOVERNANCE_SERVICE_HOST: governance-service
      GOVERNANCE_SERVICE_PORT: "8085"
      AI_AGENT_HOST: ai-agent
      AI_AGENT_PORT: "8086"
      WORKFLOW_SERVICE_HOST: workflow-service
      WORKFLOW_SERVICE_PORT: "8088"
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "8087"
      SERVING_SERVICE_HOST: serving-service
      SERVING_SERVICE_PORT: "8089"
    depends_on:
      system-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      quality-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      governance-service:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      serving-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  web:
    image: aetheris-local/web:${AETHERIS_IMAGE_TAG:-security-20260908}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_IMAGE: ${NODE_IMAGE:-docker.1panel.live/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.1panel.live/library/nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # 宿主端口可用 WEB_PORT 覆盖：Windows 上 Hyper-V 会随机保留端口区间，
      # 5173 若落入保留区间则无法绑定（报 ports are not available）。
      # 排查方法见 docs/datasource-connectivity.md。
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: aetheris_default
    ipam:
      config:
        - subnet: ${AETHERIS_DOCKER_SUBNET:-172.31.0.0/16}
