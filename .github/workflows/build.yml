name: Build Images

# CI 通过后，在 main 分支 / v* 标签推送时构建全部 11 个镜像并发布到 GHCR。
# 镜像命名与 docker-compose.yml 中的 AETHERIS_IMAGE_PREFIX 保持一致：
#   ghcr.io/mazhuce/aetheris-<name>:latest + :sha-xxxxxxx
# 服务器部署时 docker compose pull 即可拉取，无需在服务器上构建。

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mazhuce/aetheris

permissions:
  contents: read
  actions: read

jobs:
  validate-deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - name: Wait for complete same-commit CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-ci-run.py --wait-seconds 1800 --output ci-binding.json
      - name: Validate Flyway migration versions
        run: python scripts/verify-flyway-migrations.py

  build:
    needs: validate-deployment-contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: system
            context: .
            dockerfile: services/system/Dockerfile
          - name: metadata
            context: .
            dockerfile: services/metadata/Dockerfile
          - name: serving
            context: .
            dockerfile: services/serving/Dockerfile
          - name: quality
            context: .
            dockerfile: services/quality/Dockerfile
          - name: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - name: governance
            context: .
            dockerfile: services/governance/Dockerfile
          - name: workflow
            context: .
            dockerfile: services/workflow/Dockerfile
          - name: ai-agent
            context: .
            dockerfile: services/ai-agent/Dockerfile
          - name: auth
            context: .
            dockerfile: services/auth/Dockerfile
          - name: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile
          - name: web
            context: ./apps/web
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3; verified 2026-10-18

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3; verified 2026-10-18
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5; verified 2026-10-18
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6; verified 2026-10-18
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0; verified 2026-10-18
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2; verified 2026-10-18
        with:
          cosign-release: 'v2.5.3'

      - name: Sign image digest
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          SIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@${{ github.ref }}
        run: |
          cosign verify \
            --certificate-identity "$SIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"


      - name: Record immutable image provenance
        env:
          SERVICE: ${{ matrix.name }}
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: python scripts/release-manifest.py record-image --service "$SERVICE" --image "$IMAGE_REF" --commit "$GITHUB_SHA" --build-run-id "$GITHUB_RUN_ID" --build-attempt "$GITHUB_RUN_ATTEMPT" --output "digests/$SERVICE.json"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.name }}-${{ github.run_attempt }}
          path: digests/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  release-manifest:
    needs: [validate-deployment-contracts, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*-${{ github.run_attempt }}
          path: digests
          merge-multiple: true
      - name: Build release manifest and recheck CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.validate-deployment-contracts.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.validate-deployment-contracts.outputs.ci_run_attempt }}
        run: python scripts/release-manifest.py create --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_RUN_ATTEMPT" --build-run-id "$GITHUB_RUN_ID" --build-attempt "$GITHUB_RUN_ATTEMPT" --build-ref "$GITHUB_REF" --digest-dir digests --output release-manifest.json
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: 'v2.5.3'
      - name: Sign and verify release manifest
        run: |
          cosign sign-blob --yes --bundle release-manifest.bundle.json release-manifest.json
          cosign verify-blob --bundle release-manifest.bundle.json --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-manifest.json
            release-manifest.bundle.json
          if-no-files-found: error
          retention-days: 30
