name: Build Images

# CI 通过后，在 main 分支 / v* 标签推送时构建全部 11 个镜像并发布到 GHCR。
# 镜像命名与 docker-compose.yml 中各服务的 image: 字段保持一致：
#   ghcr.io/mazhuce/aetheris-<name>:latest + :sha-xxxxxxx
# 服务器部署时 docker compose pull 即可拉取，无需在服务器上构建。

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mazhuce/aetheris

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: system
            context: .
            dockerfile: services/system/Dockerfile
          - name: metadata
            context: .
            dockerfile: services/metadata/Dockerfile
          - name: serving
            context: .
            dockerfile: services/serving/Dockerfile
          - name: quality
            context: .
            dockerfile: services/quality/Dockerfile
          - name: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - name: governance
            context: .
            dockerfile: services/governance/Dockerfile
          - name: workflow
            context: .
            dockerfile: services/workflow/Dockerfile
          - name: ai-agent
            context: .
            dockerfile: services/ai-agent/Dockerfile
          - name: auth
            context: .
            dockerfile: services/auth/Dockerfile
          - name: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile
          - name: web
            context: ./apps/web
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign image digest
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
