name: Platform Build and Service Regression

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, test and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --run
      - run: npm run build

  services:
    name: Metadata and workflow Java regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -f services/metadata/pom.xml test
      - run: mvn -q -f services/workflow/pom.xml test
      - run: mvn -q -f services/auth/pom.xml test
      - run: mvn -q -f services/serving/pom.xml test
