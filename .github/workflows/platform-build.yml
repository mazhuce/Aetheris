name: Platform Build and Service Regression

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, test and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; verified 2026-10-18
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --run
      - run: npm run build

  services:
    name: Metadata and workflow Java regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4; verified 2026-10-18
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -f services/metadata/pom.xml test
      - run: mvn -q -f services/workflow/pom.xml test
      - run: mvn -q -f services/auth/pom.xml test
      - run: mvn -q -f services/serving/pom.xml test
