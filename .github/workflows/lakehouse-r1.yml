name: R1 Lakehouse Contract Gate

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  r1-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified 2026-10-18
        with:
          python-version: '3.11'

      - name: Set up Java for protocol packaging contracts
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4; verified 2026-10-18
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install pinned audit script dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-audit.txt

      - name: Prepare actual protocol host-test evidence
        run: |
          mvn -B -f libs/security-protocol/pom.xml test
          mvn -B -f libs/security-protocol/pom.xml dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.11.4

      - name: Run deterministic script regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate approved R1 release contract
        run: python scripts/validate-lakehouse-r1.py --mode release

      - name: Validate Compose profile topology without starting services
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          compose = yaml.safe_load(Path('infrastructure/lakehouse/docker-compose.r1.yml').read_text())
          services = compose['services']
          expected = {
              'object-store': {'r1', 'storage'},
              'object-store-init': {'r1', 'storage'},
              'catalog': {'r1', 'catalog'},
              'trino': {'r1', 'trino'},
              'flink-jobmanager': {'r1', 'flink'},
              'flink-taskmanager': {'r1', 'flink'},
              'flink-sql-gateway': {'r1', 'flink'},
          }
          for service, profiles in expected.items():
              actual = set(services[service].get('profiles', []))
              missing = profiles - actual
              if missing:
                  raise SystemExit(f'{service} missing profiles: {sorted(missing)}')
          print('R1 Compose profile topology passed')
          PY
