name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend services
        run: mvn -f pom.xml -s scripts/maven-mirror-settings.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install, test and build frontend
        working-directory: apps/web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run type-check
          npm test
          npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: smoke-db-password
      DB_PASSWORD: smoke-db-password
      JWT_SECRET: smoke-jwt-secret-that-is-longer-than-32-bytes
      INITIAL_ADMIN_PASSWORD: smoke-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Run cross-service smoke test
        run: bash scripts/smoke-test.sh

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
