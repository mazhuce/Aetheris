name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  documentation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate documentation integrity and core links
        run: python scripts/check-document-integrity.py
      - name: Install pinned workflow YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Validate workflow and image-inventory contracts
        run: |
          python scripts/check-workflow-contract.py
          python scripts/base-image-inventory.py --check

  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - name: Validate Flyway migration versions
        run: python scripts/verify-flyway-migrations.py
      - name: Test deployment gate scripts
        run: python -m unittest scripts/tests/test_deployment_gates.py -v
      - name: Shell-check deployment gate scripts
        run: shellcheck scripts/verify-image-signatures.sh scripts/deploy-healthcheck.sh scripts/deploy-remote.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - name: Scan source tree and dependencies
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0; verified 2026-10-18
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  spark-script-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified 2026-10-18
        with:
          python-version: '3.11'
      - name: Set up Java for protocol packaging contracts
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4; verified 2026-10-18
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned audit script dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-audit.txt
      - name: Prepare actual protocol host-test evidence
        run: |
          mvn -B -f libs/security-protocol/pom.xml test
          mvn -B -f libs/security-protocol/pom.xml dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.11.4
      - name: Verify Spark smoke and safe recovery contracts
        run: |
          python -m unittest discover -s tests -p 'test_spark*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4; verified 2026-10-18
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend services
        run: mvn -f pom.xml -s scripts/maven-mirror-settings.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; verified 2026-10-18
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install, test and build frontend
        working-directory: apps/web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run lint
          npm run type-check
          npm test
          npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: smoke-db-password
      DB_PASSWORD: smoke-db-password
      JWT_SECRET: smoke-jwt-secret-that-is-longer-than-32-bytes
      INITIAL_ADMIN_PASSWORD: smoke-admin-password
      AETHERIS_INTERNAL_TOKEN: smoke-internal-token-that-is-longer-than-32-bytes
      # DataSourceSecretService requires a base64-encoded key of exactly 32 bytes.
      # This deterministic value is test-only and must never be reused in deployments.
      AETHERIS_DATASOURCE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REDIS_PASSWORD: smoke-redis-password
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18

      - name: Validate Compose interpolation before build
        run: docker compose config --quiet

      - name: Start stack
        run: docker compose up --build -d

      - name: Run cross-service smoke test
        run: bash scripts/smoke-test.sh

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
