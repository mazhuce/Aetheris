name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend services
        run: |
          mvn -f services/system/pom.xml -s scripts/maven-mirror-settings.xml -DskipTests package
          mvn -f services/metadata/pom.xml -s scripts/maven-mirror-settings.xml -DskipTests package
          mvn -f apps/gateway/pom.xml -s scripts/maven-mirror-settings.xml -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build frontend
        working-directory: apps/web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run type-check
          npm run build
