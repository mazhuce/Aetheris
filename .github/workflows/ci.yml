name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source tree and dependencies
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  spark-script-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Spark smoke and safe recovery contracts
        run: |
          python -m unittest discover -s tests -p 'test_spark*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend services
        run: mvn -f pom.xml -s scripts/maven-mirror-settings.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install, test and build frontend
        working-directory: apps/web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run type-check
          npm test
          npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: smoke-db-password
      DB_PASSWORD: smoke-db-password
      JWT_SECRET: smoke-jwt-secret-that-is-longer-than-32-bytes
      INITIAL_ADMIN_PASSWORD: smoke-admin-password
      AETHERIS_INTERNAL_TOKEN: smoke-internal-token-that-is-longer-than-32-bytes
      AETHERIS_DATASOURCE_MASTER_KEY: smoke-datasource-master-key-that-is-long-enough
      REDIS_PASSWORD: smoke-redis-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Run cross-service smoke test
        run: bash scripts/smoke-test.sh

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
