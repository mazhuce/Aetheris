name: Deploy

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build Images run containing the signed release manifest'
        required: true
        type: string
      image_tag:
        description: 'Optional compatibility check; must match the selected release'
        required: false
        default: ''
        type: string
      cosign_policy:
        description: 'Signature policy; disabled is an explicit emergency bypass'
        required: true
        default: required
        type: choice
        options: [required, disabled]
      cosign_identity:
        description: 'Optional identity check; must match the selected build ref'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-18
      - name: Fetch release and verify exact CI/build attempts
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          REQUESTED_COSIGN_POLICY: ${{ inputs.cosign_policy }}
          REQUESTED_COSIGN_IDENTITY: ${{ inputs.cosign_identity }}
          REQUESTED_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid build run ID" >&2; exit 2; }
          python scripts/release-manifest.py fetch --repository "$GITHUB_REPOSITORY" --build-run-id "$BUILD_RUN_ID" --output-dir release
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2; verified 2026-10-18
        with:
          cosign-release: 'v2.5.3'
      - name: Verify release manifest signature
        env:
          COSIGN_POLICY: ${{ inputs.cosign_policy }}
        run: |
          if [[ "$COSIGN_POLICY" == required ]]; then
            expected="$(python scripts/release-manifest.py identity --manifest release/release-manifest.json)"
            cosign verify-blob --bundle release/release-manifest.bundle.json --certificate-identity "$expected" --certificate-oidc-issuer https://token.actions.githubusercontent.com release/release-manifest.json
          fi
      - name: Deploy verified release over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1; verified 2026-10-18
        env:
          AETHERIS_DEPLOY_PATH_B64: ${{ steps.release.outputs.path_base64 }}
          AETHERIS_RELEASE_MANIFEST_B64: ${{ steps.release.outputs.manifest_base64 }}
          AETHERIS_RELEASE_BUNDLE_B64: ${{ steps.release.outputs.bundle_base64 }}
          AETHERIS_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          AETHERIS_COSIGN_CERT_IDENTITY: ${{ steps.release.outputs.identity }}
          AETHERIS_COSIGN_POLICY: ${{ inputs.cosign_policy }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          version: '1.8.2' # same default as the pinned SSH action entrypoint
          envs: AETHERIS_DEPLOY_PATH_B64,AETHERIS_RELEASE_MANIFEST_B64,AETHERIS_RELEASE_BUNDLE_B64,AETHERIS_IMAGE_TAG,AETHERIS_COSIGN_CERT_IDENTITY,AETHERIS_COSIGN_POLICY
          command_timeout: 20m
          script: |
            set -eu
            # Transferred dynamic values are validated identifiers or base64, so
            # the SSH action never receives arbitrary shell source in envs.
            deploy_path="$(printf '%s' "$AETHERIS_DEPLOY_PATH_B64" | base64 --decode)"
            cd -- "$deploy_path"
            git pull --ff-only
            release_dir="$(mktemp -d /tmp/aetheris-release.XXXXXXXXXX)"
            trap 'rm -f -- "$release_dir/release-manifest.json" "$release_dir/release-manifest.bundle.json"; rmdir -- "$release_dir"' EXIT
            printf '%s' "$AETHERIS_RELEASE_MANIFEST_B64" | base64 --decode > "$release_dir/release-manifest.json"
            printf '%s' "$AETHERIS_RELEASE_BUNDLE_B64" | base64 --decode > "$release_dir/release-manifest.bundle.json"
            export AETHERIS_RELEASE_MANIFEST="$release_dir/release-manifest.json"
            export AETHERIS_RELEASE_MANIFEST_BUNDLE="$release_dir/release-manifest.bundle.json"
            export AETHERIS_IMAGE_PREFIX=ghcr.io/mazhuce/aetheris
            export AETHERIS_COOKIE_SECURE=true
            bash scripts/deploy-remote.sh
