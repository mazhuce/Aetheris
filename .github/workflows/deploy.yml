name: Deploy

# CD：SSH 到部署服务器，拉取最新镜像并滚动重启。
# 手动触发（Actions 页面点 Run workflow），避免 main 每次推送都自动部署。
#
# 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 配置：
#   DEPLOY_HOST   服务器地址（IP 或域名）
#   DEPLOY_USER   SSH 用户名
#   DEPLOY_SSH_KEY  SSH 私钥（PEM 格式，对应公钥需加入服务器 authorized_keys）
#   DEPLOY_PATH    服务器上项目路径（须已 checkout 仓库并放置好 .env）
#
# 服务器前置条件（一次性）：
#   1. git clone https://github.com/mazhuce/Aetheris.git 到 DEPLOY_PATH
#   2. 在 DEPLOY_PATH 创建 .env（JWT_SECRET、DEEPSEEK_API_KEY 等，参考 .env.example）
#   3. 若镜像仓库为私有：docker login ghcr.io（用 PAT with read:packages）
#   4. 首次启动：docker compose up -d（自动创建 pgdata 卷并执行 Flyway 迁移）
#   5. 服务器 PATH 中安装 cosign；部署默认拒绝未签名镜像。仅在明确的
#      紧急旁路场景下，手动选择 cosign_policy=disabled。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable image tag; blank uses the checked-out commit sha-<7>'
        required: false
        default: ''
        type: string
      cosign_policy:
        description: 'Signature policy; disabled is an explicit emergency bypass'
        required: true
        default: required
        type: choice
        options:
          - required
          - disabled
      cosign_identity:
        description: 'Expected GitHub OIDC certificate identity; required for tag builds'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            # Compose defaults to local build tags for development. Production
            # must pull the immutable sha tag published by build.yml from GHCR.
            export AETHERIS_IMAGE_PREFIX=ghcr.io/mazhuce/aetheris
            export AETHERIS_IMAGE_TAG='${{ inputs.image_tag }}'
            export AETHERIS_COSIGN_POLICY='${{ inputs.cosign_policy }}'
            export AETHERIS_COSIGN_CERT_IDENTITY='${{ inputs.cosign_identity }}'
            export AETHERIS_COOKIE_SECURE=true
            bash scripts/deploy-remote.sh
