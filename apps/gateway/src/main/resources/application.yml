server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      # 跨域不在此处配置：globalcors 的 YAML 属性实测未生效（带任意 Origin 的请求
      # 一律 403），改用 CorsConfig 里的 CorsWebFilter Bean。
      routes:
        - id: system-service
          uri: http://${SYSTEM_SERVICE_HOST:localhost}:${SYSTEM_SERVICE_PORT:8081}
          predicates:
            - Path=/api/system/**
        - id: metadata-service
          uri: http://${METADATA_SERVICE_HOST:localhost}:${METADATA_SERVICE_PORT:8082}
          predicates:
            - Path=/api/metadata/**
        - id: quality-service
          uri: http://${QUALITY_SERVICE_HOST:localhost}:${QUALITY_SERVICE_PORT:8083}
          predicates:
            - Path=/api/quality/**
        - id: ingestion-service
          uri: http://${INGESTION_SERVICE_HOST:localhost}:${INGESTION_SERVICE_PORT:8084}
          predicates:
            - Path=/api/ingestion/**
        - id: governance-service
          uri: http://${GOVERNANCE_SERVICE_HOST:localhost}:${GOVERNANCE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/governance/**
        - id: workflow-service
          uri: http://${WORKFLOW_SERVICE_HOST:localhost}:${WORKFLOW_SERVICE_PORT:8088}
          predicates:
            - Path=/api/workflow/**
        - id: serving-service
          uri: http://${SERVING_SERVICE_HOST:localhost}:${SERVING_SERVICE_PORT:8089}
          predicates:
            - Path=/api/analytics/**,/api/serving/**
        - id: ai-agent
          uri: http://${AI_AGENT_HOST:localhost}:${AI_AGENT_PORT:8086}
          predicates:
            - Path=/api/ai/**
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8087}
          predicates:
            - Path=/api/auth/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO

jwt:
  secret: ${JWT_SECRET:}

aetheris:
  rate-limit:
    capacity: ${AETHERIS_RATE_LIMIT_CAPACITY:60}
    window-seconds: ${AETHERIS_RATE_LIMIT_WINDOW_SECONDS:60}
  # 与各业务服务共享的内部令牌：用于 X-Aetheris-Identity 身份签名和
  # 调用 auth-service /internal/permissions 粗粒度判定。未配置时跳过
  # 身份签名且 access 判定将 fail-closed（503）。
  internal-token: ${AETHERIS_INTERNAL_TOKEN:}
  auth:
    base-url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8087}
  identity:
    max-skew-ms: ${AETHERIS_IDENTITY_MAX_SKEW_MS:300000}

audit:
  base-url: http://${SYSTEM_SERVICE_HOST:localhost}:${SYSTEM_SERVICE_PORT:8081}
