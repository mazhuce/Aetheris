server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: system-service
          uri: http://${SYSTEM_SERVICE_HOST:localhost}:${SYSTEM_SERVICE_PORT:8081}
          predicates:
            - Path=/api/system/**
        - id: metadata-service
          uri: http://${METADATA_SERVICE_HOST:localhost}:${METADATA_SERVICE_PORT:8082}
          predicates:
            - Path=/api/metadata/**
        - id: quality-service
          uri: http://${QUALITY_SERVICE_HOST:localhost}:${QUALITY_SERVICE_PORT:8083}
          predicates:
            - Path=/api/quality/**
        - id: ingestion-service
          uri: http://${INGESTION_SERVICE_HOST:localhost}:${INGESTION_SERVICE_PORT:8084}
          predicates:
            - Path=/api/ingestion/**
        - id: governance-service
          uri: http://${GOVERNANCE_SERVICE_HOST:localhost}:${GOVERNANCE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/governance/**
        - id: ai-agent
          uri: http://${AI_AGENT_HOST:localhost}:${AI_AGENT_PORT:8086}
          predicates:
            - Path=/api/ai/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
