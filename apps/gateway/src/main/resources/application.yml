server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: system-service
          uri: http://${SYSTEM_SERVICE_HOST:localhost}:${SYSTEM_SERVICE_PORT:8081}
          predicates:
            - Path=/api/system/**
        - id: metadata-service
          uri: http://${METADATA_SERVICE_HOST:localhost}:${METADATA_SERVICE_PORT:8082}
          predicates:
            - Path=/api/metadata/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
